<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caption Reviewer</title>
  <style>
    :root { color-scheme: dark; --bg:#111419; --panel:#1b1f27; --panel2:#151920; --line:#2a303b; --text:#eef1f6; --muted:#909aaa; --accent:#6388ff; --danger:#ff6b7a; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif; }
    button, input, textarea { font:inherit; }
    button { color:var(--text); background:#2b313c; border:1px solid transparent; border-radius:7px; padding:8px 13px; cursor:pointer; }
    button:hover { background:#39414e; } button:disabled { opacity:.35; cursor:default; }
    .accent { background:var(--accent); color:white; font-weight:600; } .accent:hover { background:#7898ff; }
    header { height:57px; display:flex; align-items:center; gap:12px; padding:0 14px; border-bottom:1px solid var(--line); }
    .brand { font-size:16px; font-weight:650; white-space:nowrap; }
    #root { color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    #conflict { display:none; align-items:center; gap:6px; color:#ffd166; font-size:12px; } #conflict.show { display:flex; }
    #saveState { color:var(--muted); min-width:110px; text-align:right; } #saveState.dirty { color:#ffd166; } #saveState.error { color:var(--danger); }
    main { height:calc(100% - 114px); min-height:0; display:grid; grid-template-columns:285px minmax(350px,1.5fr) minmax(360px,1fr); grid-template-rows:minmax(0,1fr); gap:1px; background:var(--line); }
    aside, .viewer, .editor-panel { height:100%; min-width:0; min-height:0; overflow:hidden; background:var(--panel); }
    aside { display:flex; flex-direction:column; padding:11px; }
    .eyebrow { color:var(--muted); font-size:11px; letter-spacing:.09em; font-weight:700; margin-bottom:8px; }
    .search-label { color:var(--muted); font-size:10px; letter-spacing:.07em; font-weight:700; margin:1px 2px 4px; }
    .search-label-row { display:flex; align-items:center; justify-content:space-between; gap:6px; margin:1px 2px 4px; }
    .search-label-row .search-label { min-width:0; margin:0; }
    .search-mode { flex:none; min-width:60px; padding:1px 5px; border:1px solid currentColor; border-radius:4px; background:transparent; font-size:10px; line-height:1.35; font-weight:700; }
    .search-mode:hover { background:#2a313c; }
    .search-mode[data-mode="everything"] { color:#55d77b; }
    .search-mode[data-mode="caption"] { color:#f0ca61; }
    .search-mode[data-mode="tags"] { color:#62a9ff; }
    .filter-input { width:100%; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:7px; outline:none; padding:9px 10px; margin-bottom:8px; }
    .filter-input:focus { border-color:var(--accent); }
    #list { flex:1; min-height:0; overflow:auto; scrollbar-color:#424b59 transparent; }
    .item { width:100%; display:flex; align-items:center; gap:8px; border:0; border-radius:5px; background:transparent; padding:6px 8px; text-align:left; color:#cdd3dd; white-space:nowrap; }
    .item.stale .item-label { font-style:italic; opacity:.7; }
    .item:hover { background:#252b35; } .item.active { background:var(--accent); color:white; }
    .item.viewed { color:#f3d77a; font-weight:600; } .item.edited { color:#e96f1a; font-weight:600; } .item.done { color:#35e47a; font-weight:600; }
    .item.viewed.active { color:#f3d77a; } .item.edited.active { color:#e96f1a; } .item.done.active { color:#35e47a; }
    .dot { width:7px; height:7px; border-radius:50%; background:#596273; flex:none; } .dot.missing { background:#e7a94b; }
    .item-label { overflow:hidden; text-overflow:ellipsis; }
    #listCount { color:var(--muted); font-size:12px; margin-top:8px; }
    .viewer { display:flex; flex-direction:column; padding:10px; }
    #imageStage { position:relative; flex:1 1 0; min-width:0; min-height:0; overflow:auto; background:#0a0c0f linear-gradient(135deg,#090b0e 0%,#242a33 50%,#0c1015 100%); border-radius:7px; }
    #imageHost { position:absolute; inset:0; }
    #image { display:block; width:100%; height:100%; object-fit:contain; object-position:right center; }
    #imageStage.actual #imageHost { position:static; width:max-content; height:max-content; }
    #imageStage.actual #image { width:auto; height:auto; max-width:none; max-height:none; }
    #directionTools { flex:none; display:flex; align-items:center; gap:5px; padding:3px 5px; border:1px solid #343d4b; border-radius:7px; background:#202630; }
    #directionTools[hidden] { display:none; }
    .direction-kicker { padding-right:6px; border-right:1px solid #3a4351; color:var(--muted); font-size:9px; line-height:1.2; letter-spacing:.08em; font-weight:700; white-space:nowrap; }
    #directionScope { margin:0 2px 0 0; color:#dbe4f4; font-size:10px; letter-spacing:.05em; font-weight:750; white-space:nowrap; }
    .direction-action { width:auto; margin:0; padding:4px 7px; font-size:11px; line-height:1.3; font-weight:650; white-space:nowrap; }
    .viewer-bar { flex:0 0 43px; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    #imageName { flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tiny { padding:5px 9px; font-size:12px; }
    .editor-panel { padding:11px; display:grid; grid-template-rows:auto minmax(90px,1.1fr) auto minmax(130px,1.7fr) auto minmax(110px,1.5fr); }
    .caption-head { display:flex; } #stats { margin-left:auto; color:var(--muted); font-size:12px; }
    .text-editor-wrap { position:relative; width:100%; height:100%; min-height:0; background:var(--panel2); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .split-editor { position:relative; z-index:2; width:100%; height:100%; min-height:0; resize:none; color:var(--text); caret-color:var(--text); background:var(--panel2); border:0; border-radius:7px; outline:none; padding:12px 14px; font:18px/1.55 "Segoe UI",system-ui,sans-serif; }
    .split-editor:disabled { opacity:.45; }
    .text-editor-wrap:focus-within { border-color:#3c4656; }
    .editor-highlights { position:absolute; z-index:1; inset:0; overflow:hidden; padding:12px 14px; color:var(--text); background:var(--panel2); white-space:pre-wrap; overflow-wrap:break-word; font:18px/1.55 "Segoe UI",system-ui,sans-serif; pointer-events:none; visibility:hidden; }
    .text-editor-wrap.highlighting .editor-highlights { visibility:visible; }
    .text-editor-wrap.highlighting .split-editor { color:transparent; -webkit-text-fill-color:transparent; background:transparent; }
    .caption-match { color:#56a8ff; background:rgba(49,132,255,.2); border-radius:3px; animation:bluePulse .72s ease-in-out infinite alternate; }
    .caption-match.deleting { text-decoration-line:line-through; text-decoration-color:#ff4058; text-decoration-thickness:3px; }
    .tag-head { display:flex; align-items:end; margin-top:11px; padding:10px 2px 7px; border-top:1px solid var(--line); }
    #tagCount { margin-left:auto; color:var(--muted); font-size:12px; }
    #tagPanel { min-height:0; overflow:auto; align-content:start; display:flex; flex-wrap:wrap; gap:7px; padding:11px; background:var(--panel2); border:1px solid var(--line); border-radius:7px; scrollbar-color:#424b59 transparent; }
    .tag-chip { display:inline-flex; align-items:center; align-self:flex-start; max-width:100%; min-height:30px; padding:3px 4px 3px 10px; border:1px solid #3a4351; border-radius:999px; background:#282f39; color:#e3e7ee; }
    .tag-chip:hover, .tag-chip.search-highlight { animation:chipBluePulse .72s ease-in-out infinite alternate; }
    .tag-text { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tag-remove { flex:none; width:24px; height:24px; margin-left:5px; padding:0; display:grid; place-items:center; border:0; border-radius:50%; background:transparent; color:#9da6b4; font-size:17px; line-height:1; }
    .tag-remove:hover { color:white; background:#d94b5c; }
    .tag-empty { color:var(--muted); font-size:13px; padding:3px; }
    #undoToast { position:fixed; z-index:20; right:18px; bottom:68px; display:flex; align-items:center; gap:14px; max-width:440px; padding:10px 12px 10px 15px; color:var(--text); background:#303744; border:1px solid #4a5566; border-radius:9px; box-shadow:0 8px 28px rgba(0,0,0,.38); opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .15s,transform .15s; }
    #undoToast.visible { opacity:1; transform:none; pointer-events:auto; }
    #undoMessage { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #undoButton { flex:none; padding:5px 9px; color:#9fc0ff; background:transparent; font-weight:650; }
    @keyframes bluePulse { from { color:#69b4ff; background-color:rgba(49,132,255,.16); } to { color:#b9dcff; background-color:rgba(49,132,255,.38); } }
    @keyframes chipBluePulse { from { color:#69b4ff; border-color:#348cff; box-shadow:0 0 0 0 rgba(52,140,255,.1); } to { color:#c5e3ff; border-color:#8bc2ff; box-shadow:0 0 0 2px rgba(52,140,255,.28); } }
    footer { height:57px; display:flex; align-items:center; padding:0 14px; border-top:1px solid var(--line); }
    #position { flex:1; text-align:center; color:var(--muted); }
    .empty { color:var(--muted); padding:25px; text-align:center; }
    @media (max-width:1050px) { main { grid-template-columns:230px minmax(300px,1fr) minmax(320px,1fr); } }
    .mode-switch { flex:none; display:flex; gap:2px; padding:3px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; }
    .mode-switch button { padding:4px 13px; font-size:12px; background:transparent; }
    .mode-switch button.active { background:var(--accent); color:white; font-weight:650; }
    #gridPanel { display:none; }
    body.grid-mode main { grid-template-columns:285px minmax(0,1fr); }
    body.grid-mode .viewer, body.grid-mode .editor-panel, body.grid-mode #save, body.grid-mode footer > button { display:none; }
    body.grid-mode #gridPanel { display:flex; flex-direction:column; height:100%; min-width:0; min-height:0; background:var(--panel); }
    .grid-toolbar { flex:none; display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:8px 12px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
    .grid-toolbar label { display:flex; align-items:center; gap:6px; }
    .grid-toolbar input[type=range] { width:130px; }
    #gridHint { margin-left:auto; }
    .group-forms { flex:none; display:grid; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); }
    .group-form { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
    .group-badge { flex:none; min-width:112px; padding:4px 8px; border:2px solid; border-radius:6px; font-weight:700; }
    .group-form[data-group="a"] .group-badge { color:#8eaaff; border-color:var(--group-a); }
    .group-form[data-group="b"] .group-badge { color:#ffb36b; border-color:var(--group-b); }
    .group-form .group-tags { flex:1 1 240px; margin:0; padding:6px 9px; }
    .group-form .group-probability { width:64px; margin:0; padding:6px 7px; }
    .group-form label { display:flex; align-items:center; gap:4px; white-space:nowrap; }
    .group-form label.disabled { opacity:.4; }
    .group-result { flex-basis:100%; min-height:0; color:#9fd6ae; }
    .group-result:empty { display:none; } .group-result.error { color:var(--danger); }
    :root { --group-a:#5b83ff; --group-b:#ff9b3d; }
    #grid { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--tile,200px),1fr)); grid-auto-rows:max-content; align-content:start; gap:8px; padding:10px 12px; scrollbar-color:#424b59 transparent; }
    .tile { position:relative; align-self:start; overflow:hidden; border-radius:6px; background:#0a0c0f; cursor:pointer; user-select:none; -webkit-user-select:none; }
    .tile::before { content:''; display:block; padding-top:100%; }
    .tile img { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:contain; transform-origin:50% 50%; pointer-events:none; }
    .tile::after { content:''; position:absolute; inset:0; border-radius:6px; pointer-events:none; }
    .tile:hover::after { box-shadow:inset 0 0 0 2px #5d6676; }
    .tile.sel-a::after { box-shadow:inset 0 0 0 4px var(--group-a); }
    .tile.sel-b::after { box-shadow:inset 0 0 0 4px var(--group-b); }
    .tile.sel-a.sel-b::after { box-shadow:inset 0 0 0 4px var(--group-a),inset 0 0 0 8px var(--group-b); }
    .tile.flash::after { animation:tileFlash .45s ease-in-out 3 alternate; }
    @keyframes tileFlash { from { box-shadow:inset 0 0 0 4px rgba(255,255,255,0); } to { box-shadow:inset 0 0 0 4px rgba(255,255,255,.9); } }
    .tile-badges { position:absolute; z-index:2; top:6px; left:6px; display:flex; gap:4px; pointer-events:none; }
    .tile-badge { display:none; width:20px; height:20px; border-radius:50%; place-items:center; color:white; font-size:11px; font-weight:800; }
    .tile.sel-a .badge-a { display:grid; background:var(--group-a); } .tile.sel-b .badge-b { display:grid; background:var(--group-b); }
    .tile-meta { position:absolute; z-index:2; left:0; right:0; bottom:0; display:flex; gap:6px; padding:12px 7px 4px; color:#dfe5ee; font-size:11px; background:linear-gradient(transparent,rgba(0,0,0,.78)); pointer-events:none; }
    .tile-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tile-status { font-weight:800; } .tile-status.st-V { color:#f3d77a; } .tile-status.st-E { color:#e96f1a; } .tile-status.st-D { color:#35e47a; }
    .tile.zoomed .tile-meta, .tile.zoomed .tile-badges { opacity:0; }
    .tile.missing-caption .tile-name::before { content:'● '; color:#e7a94b; }
    #gridMore { grid-column:1/-1; height:1px; }
    #grid:focus { outline:none; }
    .grid-empty { grid-column:1/-1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Caption Reviewer</div>
    <div class="mode-switch" role="group" aria-label="View mode">
      <button id="modeReview" type="button" class="active" title="Review one image at a time">Review</button>
      <button id="modeGrid" type="button" title="Skim thumbnails, select images, and add tags to them">Grid</button>
    </div>
    <div id="root"></div>
    <select id="captionMode" class="search-mode" style="min-width:0;padding:2px 4px;color:var(--text);background:var(--panel2)" title="Which caption files to review: .txt, prose-only .caption training captions, or both (two entries per image)">
      <option value="txt">.txt captions</option>
      <option value="caption">.caption captions</option>
      <option value="both">.txt + .caption</option>
    </select>
    <button id="refresh" class="tiny" title="Rescan for newly generated captions and images">Refresh</button>
    <span id="conflict" title="This caption file was changed by another program while you had unsaved edits.">
      Changed on disk:
      <button id="conflictLoad" class="tiny" type="button" title="Discard your unsaved edits and load the version on disk">Load disk version</button>
      <button id="conflictKeep" class="tiny" type="button" title="Save your text over the version on disk">Keep mine</button>
    </span>
    <span id="saveState">Loading…</span>
    <button id="save">Save&nbsp; Ctrl+S</button>
  </header>
  <main>
    <aside>
      <div class="eyebrow">IMAGES</div>
      <div class="search-label">IMAGE NAME</div>
      <input id="search" class="filter-input" type="search" placeholder="Folder or filename…" autocomplete="off">
      <div class="search-label-row">
        <div class="search-label">TEXT FILE CONTENT</div>
        <button id="textSearchMode" class="search-mode" type="button" data-mode="everything">Everything</button>
      </div>
      <input id="textSearch" class="filter-input" type="search" placeholder="Exact text occurrence…" autocomplete="off">
      <div class="search-label-row">
        <div class="search-label">EXCLUDE TEXT FILE CONTENT</div>
        <button id="negativeTextSearchMode" class="search-mode" type="button" data-mode="everything">Everything</button>
      </div>
      <input id="negativeTextSearch" class="filter-input" type="search" placeholder="Text that must be absent…" autocomplete="off">
      <div id="list"></div>
      <div id="listCount"></div>
    </aside>
    <section class="viewer">
      <div id="imageStage">
        <div id="imageHost"><div class="empty">Choose an image</div></div>
      </div>
      <div class="viewer-bar">
        <span id="imageName"></span>
        <div id="directionTools" hidden>
          <span class="direction-kicker">CAPTION FIX</span>
          <span id="directionScope"></span>
          <button id="directionSwap" class="direction-action" type="button"></button>
          <button id="directionChange" class="direction-action" type="button"></button>
          <button id="directionRemove" class="direction-action" type="button"></button>
        </div>
        <button id="fit" class="tiny">100%</button>
      </div>
    </section>
    <section class="editor-panel">
      <div class="caption-head"><div class="eyebrow">TAGS (TEXT)</div><span id="stats"></span></div>
      <div id="tagTextWrap" class="text-editor-wrap">
        <div id="tagTextHighlights" class="editor-highlights" aria-hidden="true"></div>
        <textarea id="tagTextEditor" class="split-editor" spellcheck="false" disabled></textarea>
      </div>
      <div class="tag-head"><div class="eyebrow" style="margin:0">CAPTION</div></div>
      <div id="descriptionWrap" class="text-editor-wrap">
        <div id="descriptionHighlights" class="editor-highlights" aria-hidden="true"></div>
        <textarea id="descriptionEditor" class="split-editor" spellcheck="true" disabled></textarea>
      </div>
      <div class="tag-head"><div class="eyebrow" style="margin:0">TAGS</div><span id="tagCount"></span></div>
      <div id="tagPanel"><span class="tag-empty">Choose an image to view its tags.</span></div>
    </section>
    <section id="gridPanel">
      <div class="grid-toolbar">
        <label title="Thumbnail size">Size <input id="tileSize" type="range" min="110" max="520" step="10" value="200"></label>
        <label title="How the mouse wheel zooms into the image under the cursor">Zoom
          <select id="wheelMode" class="search-mode" style="min-width:0;padding:2px 4px;color:var(--text);background:var(--panel2)">
            <option value="ctrl">Ctrl+wheel zooms</option>
            <option value="wheel">Wheel zooms</option>
          </select>
        </label>
        <span id="gridHint">Click: group A · Shift+click: group B · <span id="zoomHint">Ctrl+wheel</span> over an image: zoom</span>
      </div>
      <div class="group-forms">
        <div class="group-form" data-group="a"></div>
        <div class="group-form" data-group="b"></div>
      </div>
      <div id="grid"></div>
    </section>
  </main>
  <footer>
    <button id="previous">←&nbsp; Previous unfinished</button>
    <div id="position">No images</div>
    <button id="next" class="accent">Next unfinished&nbsp; →</button>
  </footer>
  <div id="undoToast" role="status"><span id="undoMessage"></span><button id="undoButton" type="button">Undo</button></div>
  <script src="/caption_direction_tools.js"></script>
  <script src="/caption_filter_tools.js"></script>
  <script src="/caption_grid_tools.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const {parseDirectionQuery,containsDirection,editDescription,opposite}=CaptionDirectionTools;
    const {flattenCaptionPart,splitTags,splitCaptionText,joinCaptionText,searchableCaptionText}=CaptionFilterTools;
    let items = [], filtered = [], currentId = null, dirty = false, revision = 0;
    let saveTimer = null, saveInFlight = null, viewed = new Set(), actualSize = false;
    let lastTagDeletion = null, undoToastTimer = null;
    let currentCaptionVersion = null, refreshInFlight = false, serverCaptionMode = 'txt';
    let stickyId = null; // open image kept in the list after an edit made it stop matching the filter
    let itemsRequestGeneration = 0, navigationRequestGeneration = 0;
    const searchModes=[
      {key:'everything',label:'Everything',description:'the entire text file'},
      {key:'caption',label:'Caption',description:'the caption only'},
      {key:'tags',label:'Tags',description:'the tags only'},
    ];

    function setSaveState(text, kind='') { $('saveState').textContent=text; $('saveState').className=kind; }
    async function fetchJson(url,options={},timeoutMs=15000) {
      const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),timeoutMs);
      try {
        const response=await fetch(url,{...options,signal:controller.signal});
        let data;
        try { data=await response.json(); }
        catch { data={error:`Invalid response from Caption Reviewer (${response.status})`}; }
        if (!response.ok) throw new Error(data.error || `Caption Reviewer request failed (${response.status})`);
        return data;
      } catch(error) {
        if (error?.name==='AbortError') throw new Error('Caption Reviewer request timed out. Try again; your open text has not been discarded.');
        throw error;
      } finally { clearTimeout(timer); }
    }
    function editorCaption() { return joinCaptionText(tagsFromEditor(),$('descriptionEditor').value); }
    function tagsFromEditor() {
      const value=$('tagTextEditor').value.replace(/\.\s*$/,'');
      return splitTags(value);
    }
    function currentProseOnly() { return currentId!==null && !!items[currentId]?.proseOnly; }
    function setEditorCaption(value) {
      const parts=splitCaptionText(value,currentProseOnly());
      $('tagTextEditor').value=parts.tags.join(', ')+(parts.tags.length && parts.description?'. ':'');
      $('descriptionEditor').value=parts.description;
    }
    function normalizeTagSeparator() {
      const tags=tagsFromEditor(), hasDescription=$('descriptionEditor').value.trim().length>0;
      const normalized=tags.join(', ')+(tags.length && hasDescription?'. ':'');
      const changed=$('tagTextEditor').value!==normalized;
      if (changed) $('tagTextEditor').value=normalized;
      return changed;
    }
    function updateStats() { const text=editorCaption(); $('stats').textContent=`${text.length.toLocaleString()} characters · ${(text.trim() ? text.trim().split(/\s+/).length : 0).toLocaleString()} words`; }
    function apiError(error) {
      const message=error?.message || String(error);
      setSaveState('Error', 'error'); $('saveState').title=message; console.error(message);
    }
    function renderDirectionTools() {
      const query=$('textSearchMode').dataset.mode==='tags'?null:parseDirectionQuery($('textSearch').value), tools=$('directionTools');
      tools.hidden=!query;
      if (!query) return;
      const other=opposite(query.side), source=query.side[0].toLocaleUpperCase(), target=other[0].toLocaleUpperCase();
      const phrase=`${query.scope} ${query.side}`, otherPhrase=`${query.scope} ${other}`;
      $('directionScope').textContent=`${query.scope.toLocaleUpperCase()} · ${query.side.toLocaleUpperCase()}`;
      $('directionSwap').textContent='L ⇄ R';
      $('directionChange').textContent=`${source} → ${target}`;
      $('directionRemove').textContent=`✕ ${source} sentences`;

      const tags=document.createElement('input'); tags.className='filter-input group-tags'; tags.type='text'; tags.autocomplete='off'; tags.spellcheck=false;
      tags.placeholder=`Tags to add to ${GROUP_NAMES[group]}, comma-separated…`;
      const probabilityLabel=document.createElement('label'); probabilityLabel.title='Chance for each tag in each caption (0.0-1.0), like manual.py';
      const probability=document.createElement('input'); probability.className='filter-input group-probability'; probability.type='number'; probability.min='0'; probability.max='1'; probability.step='0.05';
      probability.value=storage.get(key+'probability','1'); probabilityLabel.append('Chance',probability);
      const randomLabel=document.createElement('label'); randomLabel.title='Randomize ordinary tag placement';
      const randomize=document.createElement('input'); randomize.type='checkbox'; randomize.checked=storage.get(key+'randomize','0')==='1'; randomLabel.append(randomize,'Random placement');
      const importantLabel=document.createElement('label'); importantLabel.title='Treat added ordinary tags as important (favor earlier placement)';
      const important=document.createElement('input'); important.type='checkbox'; important.checked=storage.get(key+'important','0')==='1'; importantLabel.append(important,'Favor earlier');
      const apply=document.createElement('button'); apply.type='button'; apply.className='tiny accent group-apply'; apply.textContent='Apply';
      const selectShown=document.createElement('button'); selectShown.type='button'; selectShown.className='tiny'; selectShown.textContent='Select shown'; selectShown.title=`Add every image that matches the filters to ${GROUP_NAMES[group]}`;
      const clear=document.createElement('button'); clear.type='button'; clear.className='tiny group-clear'; clear.textContent='Clear';
      const result=document.createElement('div'); result.className='group-result';
      const syncImportant=()=>{ important.disabled=!randomize.checked; importantLabel.classList.toggle('disabled',!randomize.checked); };
      syncImportant();
      randomize.addEventListener('change',()=>{ storage.set(key+'randomize',randomize.checked?'1':'0'); syncImportant(); });
      important.addEventListener('change',()=>storage.set(key+'important',important.checked?'1':'0'));
      probability.addEventListener('change',()=>storage.set(key+'probability',probability.value));
      tags.addEventListener('keydown',event=>{ if (event.key==='Enter') { event.preventDefault(); applyGroup(group); } });
      apply.addEventListener('click',()=>applyGroup(group));
      selectShown.addEventListener('click',()=>{ for (const item of filtered) groups[group].add(item.path); document.querySelectorAll('#grid .tile').forEach(paintTileSelection); updateGridStatus(); });
      clear.addEventListener('click',()=>clearGroup(group));
      form.append(badge,tags,probabilityLabel,randomLabel,importantLabel,apply,selectShown,clear,result);
    }
    function clearGroup(group) {
      const paths=[...groups[group]]; groups[group].clear();
      for (const path of paths) { const tile=tileFor(path); if (tile) paintTileSelection(tile); }
      updateGridStatus();
    }
    function setGroupResult(group,text,isError=false) {
      const result=document.querySelector(`.group-form[data-group="${group}"] .group-result`);
      result.textContent=text; result.classList.toggle('error',isError);
    }
    async function applyGroup(group) {
      const form=document.querySelector(`.group-form[data-group="${group}"]`);
      const tags=splitTags(form.querySelector('.group-tags').value), paths=[...groups[group]];
      const probability=GridTools.parseProbability(form.querySelector('.group-probability').value);
      const randomize=form.querySelector('input[type=checkbox]').checked, important=randomize && form.querySelectorAll('input[type=checkbox]')[1].checked;
      if (!paths.length) { setGroupResult(group,`Select images first (${group==='a'?'click':'Shift+click'} thumbnails).`,true); return; }
      if (!tags.length) { setGroupResult(group,'Enter at least one tag.',true); form.querySelector('.group-tags').focus(); return; }
      if (probability===null) { setGroupResult(group,'Chance must be a number from 0.0 to 1.0.',true); return; }
      const options=[probability<1?`chance ${probability}`:'',randomize?(important?'random placement, favor earlier':'random placement'):''].filter(Boolean).join(', ');
      if (!confirm(`Add “${tags.join(', ')}” to ${paths.length.toLocaleString()} caption file(s) in ${GROUP_NAMES[group]}?${options?`\n\nOptions: ${options}`:''}\n\nTags already present are skipped.`)) return;
      const apply=form.querySelector('.group-apply'); apply.disabled=true; setGroupResult(group,'Adding tags…');
      try {
        if (!await flushSave()) throw new Error('Could not save the open caption first.');
        const data=await fetchJson('/api/add-tags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths,tags:tags.join(', '),probability,randomize,important})},120000);
        items=data.items;
        const problems=[...data.missing.map(path=>`${path}: image no longer exists`),...data.failed.map(entry=>`${entry.path}: ${entry.error}`)];
        const parts=[`${data.changed.length.toLocaleString()} changed`,`${data.unchanged.length.toLocaleString()} already had the tag(s)`];
        if (data.skipped.length) parts.push(`${data.skipped.length.toLocaleString()} skipped by chance`);
        if (problems.length) parts.push(`${problems.length.toLocaleString()} failed`);
        groups[group].clear(); form.querySelector('.group-tags').value='';
        setGroupResult(group,`Added “${tags.join(', ')}”: ${parts.join(' · ')}.${problems.length?' '+problems.slice(0,3).join('; '):''}`,problems.length>0);
        if (problems.length) console.error(problems.join('\n'));
        const scrollTop=$('grid').scrollTop, limit=gridLimit; filterItems(); if (limit>gridLimit) extendGrid(Math.min(limit,filtered.length)-1); $('grid').scrollTop=scrollTop;
        setSaveState('Saved');
      } catch(error) { setGroupResult(group,error?.message || String(error),true); apiError(error); }
      finally { updateGridStatus(); }
    }
    function applyTileZoom(tile,zoom,origin) {
      const image=tile.querySelector('img'); if (!image) return;
      tile.dataset.zoom=String(zoom);
      if (origin) image.style.transformOrigin=`${origin.x*100}% ${origin.y*100}%`;
      image.style.transform=zoom>1?`scale(${zoom})`:'';
      tile.classList.toggle('zoomed',zoom>1);
      if (GridTools.needsFullResolution(zoom) && !tile.dataset.full) {
        tile.dataset.full='loading';
        const full=new Image(), id=tile.dataset.id;
        full.onload=()=>{ if (tile.dataset.full==='loading') { image.src=full.src; tile.dataset.full='1'; } };
        full.onerror=()=>{ delete tile.dataset.full; };
        full.src=`/api/image?id=${id}`;
      }
    }
    function resetTileZoom(tile) {
      if (!tile.dataset.zoom && !tile.dataset.full) return;
      const image=tile.querySelector('img');
      delete tile.dataset.zoom; tile.classList.remove('zoomed');
      if (image) { image.style.transform=''; image.style.transformOrigin=''; }
      if (tile.dataset.full) { delete tile.dataset.full; const item=items[Number(tile.dataset.id)]; if (image && item) image.src=thumbUrl(item); }
    }
    function updateZoomHint() {
      $('wheelMode').value=wheelMode;
      $('zoomHint').textContent=wheelMode==='wheel'?'Wheel':'Ctrl+wheel';
      $('gridHint').title=wheelMode==='wheel'
        ?'Wheel over an image zooms it. Scroll with the scrollbar, PageUp/PageDown, or the wheel over gaps between images.'
        :'Ctrl+wheel over an image zooms it; the plain wheel scrolls the grid.';
    }
    async function setViewMode(mode) {
      if (mode===viewMode || modeSwitchInFlight) return;
      modeSwitchInFlight=true;
      try {
        if (mode==='grid') {
          if (!await flushSave()) return;
          pendingReviewPath=currentId===null?pendingReviewPath:items[currentId]?.path ?? null;
          hideUndoToast(true);
        }
        viewMode=mode; storage.set('mode',mode);
        document.body.classList.toggle('grid-mode',mode==='grid');
        $('modeReview').classList.toggle('active',mode==='review'); $('modeGrid').classList.toggle('active',mode==='grid');
        if (mode==='grid') { renderGrid(); $('grid').focus({preventScroll:true}); }
        else {
          $('grid').replaceChildren(); gridObserver?.disconnect(); gridObserver=null;
          // Reload the caption from disk: grid tagging may have changed it.
          const path=pendingReviewPath; currentId=null; pendingReviewPath=null;
          scrollActive(false); await openReviewTarget(path);
        }
      } finally { modeSwitchInFlight=false; }
    }

    document.querySelectorAll('.group-form').forEach(buildGroupForm);
    $('grid').tabIndex=-1;
    $('tileSize').value=String(tileSize); document.documentElement.style.setProperty('--tile',`${tileSize}px`);
    $('tileSize').addEventListener('input',()=>{ tileSize=Number($('tileSize').value); document.documentElement.style.setProperty('--tile',`${tileSize}px`); });
    $('tileSize').addEventListener('change',()=>{ storage.set('tileSize',String(tileSize)); document.querySelectorAll('#grid .tile').forEach(tile=>{ const item=items[Number(tile.dataset.id)], image=tile.querySelector('img'); if (item && image && !tile.dataset.full && !image.dataset.fallback) image.src=thumbUrl(item); }); });
    $('wheelMode').addEventListener('change',()=>{ wheelMode=$('wheelMode').value==='wheel'?'wheel':'ctrl'; storage.set('wheelMode',wheelMode); updateZoomHint(); });
    updateZoomHint();
    $('modeReview').addEventListener('click',()=>setViewMode('review'));
    $('modeGrid').addEventListener('click',()=>setViewMode('grid'));
    $('grid').addEventListener('mousedown',event=>{ if (event.shiftKey && event.target.closest('.tile')) event.preventDefault(); });
    $('grid').addEventListener('click',event=>{
      const tile=event.target.closest('.tile'); if (!tile || event.button!==0) return;
      GridTools.toggleInGroup(groups,event.shiftKey?'b':'a',tile.dataset.path);
      paintTileSelection(tile); updateGridStatus();
    });
    $('grid').addEventListener('wheel',event=>{
      const tile=event.target.closest('.tile'); if (!tile) return;
      if (!GridTools.wantsZoom(wheelMode,event.ctrlKey)) return;
      event.preventDefault();
      const zoom=GridTools.nextZoom(Number(tile.dataset.zoom||1),event.deltaY,event.deltaMode);
      applyTileZoom(tile,zoom,GridTools.pointerOrigin(tile.getBoundingClientRect(),event.clientX,event.clientY));
      if (zoom<=1) resetTileZoom(tile);
    },{passive:false});
    $('grid').addEventListener('mousemove',event=>{
      const tile=event.target.closest('.tile'); if (!tile || !tile.dataset.zoom) return;
      const origin=GridTools.pointerOrigin(tile.getBoundingClientRect(),event.clientX,event.clientY);
      tile.querySelector('img').style.transformOrigin=`${origin.x*100}% ${origin.y*100}%`;
    });
    $('grid').addEventListener('mouseout',event=>{
      const tile=event.target.closest('.tile'); if (!tile || tile.contains(event.relatedTarget)) return;
      resetTileZoom(tile);
    });
    // Block the browser's own Ctrl+wheel page zoom anywhere over the grid in Ctrl mode.
    window.addEventListener('wheel',event=>{ if (viewMode==='grid' && event.ctrlKey && event.target.closest?.('#grid')) event.preventDefault(); },{passive:false});

    $('tagTextEditor').addEventListener('input',markDirty);
    $('descriptionEditor').addEventListener('input',()=>{normalizeTagSeparator();markDirty()});
    $('tagTextEditor').addEventListener('blur',()=>{if(normalizeTagSeparator()) markDirty()});
    for (const editor of [$('tagTextEditor'),$('descriptionEditor')]) editor.addEventListener('keydown',handleEditorBoundary);
    $('tagTextEditor').addEventListener('scroll',()=>syncHighlightScroll('tagTextEditor','tagTextHighlights'));
    $('descriptionEditor').addEventListener('scroll',()=>syncHighlightScroll('descriptionEditor','descriptionHighlights'));
    $('save').addEventListener('click',saveNow); $('previous').addEventListener('click',()=>navigate(-1)); $('next').addEventListener('click',()=>navigate(1)); $('undoButton').addEventListener('click',undoTagDeletion);
    $('directionSwap').addEventListener('click',()=>applyDirectionEdit('swap'));
    $('directionChange').addEventListener('click',()=>applyDirectionEdit('change'));
    $('directionRemove').addEventListener('click',()=>applyDirectionEdit('remove'));
    $('fit').addEventListener('click',toggleFit); $('search').addEventListener('input',filterItems);
    $('textSearch').addEventListener('input',()=>{filterItems();if($('textSearch').matches(':hover')) showTextSearchHighlights()});
    $('negativeTextSearch').addEventListener('input',filterItems);
    for (const button of [$('textSearchMode'),$('negativeTextSearchMode')]) {
      updateSearchModeButton(button); button.addEventListener('click',()=>cycleSearchMode(button));
    }
    $('textSearch').addEventListener('mouseenter',showTextSearchHighlights);
    $('textSearch').addEventListener('mouseleave',clearTagHighlights);
    for (const id of ['search','textSearch','negativeTextSearch']) $(id).addEventListener('input',()=>{stickyId=null},{capture:true});
    $('conflictLoad').addEventListener('click',loadConflictVersion);
    $('conflictKeep').addEventListener('click',keepMyVersion);
    $('captionMode').addEventListener('change',async()=>{
      const select=$('captionMode'), mode=select.value;
      if (refreshInFlight || !await flushSave()) { select.value=serverCaptionMode; return; }
      refreshInFlight=true; $('refresh').disabled=true; select.disabled=true;
      try {
        await fetchJson('/api/caption-mode?mode='+encodeURIComponent(mode),{method:'POST'},60000);
        await loadItems();
      } catch(error) { apiError(error); }
      finally { refreshInFlight=false; $('refresh').disabled=false; select.disabled=false; }
    });
    $('refresh').addEventListener('click',async()=>{
      if (refreshInFlight || !await flushSave()) return;
      refreshInFlight=true; $('refresh').disabled=true;
      try { await loadItems(true); } catch(error) { apiError(error); }
      finally { refreshInFlight=false; $('refresh').disabled=false; }
    });
    document.addEventListener('keydown',event=>{
      if (event.ctrlKey && event.key.toLowerCase()==='s') { event.preventDefault(); saveNow(); }
      if (event.ctrlKey && event.key.toLowerCase()==='f') { event.preventDefault(); const search=event.shiftKey?$('textSearch'):$('search'); search.focus(); search.select(); }
      if (viewMode==='grid') return; // The rest act on the single-image editor, which grid mode hides.
      if (event.ctrlKey && !event.shiftKey && event.key.toLowerCase()==='z' && lastTagDeletion?.itemId===currentId && editorCaption()===lastTagDeletion.after) { event.preventDefault(); undoTagDeletion(); }
      if (event.altKey && event.key.toLowerCase()==='d') { event.preventDefault(); markDoneAndAdvance(); }
      if (event.altKey && event.key==='ArrowLeft') { event.preventDefault(); navigate(-1); }
      if (event.altKey && event.key==='ArrowRight') { event.preventDefault(); navigate(1); }
      if (event.ctrlKey && event.key==='PageUp') { event.preventDefault(); navigate(-1); }
      if (event.ctrlKey && event.key==='PageDown') { event.preventDefault(); navigate(1); }
    });
    document.addEventListener('visibilitychange',()=>{if(document.hidden) saveNow()});
    window.addEventListener('pagehide',()=>{if(dirty&&currentId!==null) navigator.sendBeacon(`/api/caption?id=${currentId}`,new Blob([JSON.stringify({caption:editorCaption(),captionVersion:currentCaptionVersion})],{type:'application/json'}))});
    // Conflict handling: the caption file changed on disk while this editor had unsaved edits.
    let conflict=null; // {id, caption, captionVersion} of the version on disk
    function hideConflict() { conflict=null; $('conflict').classList.remove('show'); }
    async function showConflict(id) {
      try {
        const data=await fetchJson(`/api/caption-peek?id=${id}`);
        if (id!==currentId) return;
        conflict={id,caption:data.caption,captionVersion:data.captionVersion};
        $('conflict').classList.add('show');
        setSaveState('Not saved: changed on disk','dirty');
      } catch(error) { apiError(error); }
    }
    function loadConflictVersion() {
      if (!conflict || conflict.id!==currentId) return hideConflict();
      clearTimeout(saveTimer); setEditorCaption(conflict.caption); currentCaptionVersion=conflict.captionVersion;
      items[currentId].captionSearch=conflict.caption; dirty=false; revision++;
      updateStats(); renderTags(); renderDirectionTools(); hideConflict(); setSaveState('Loaded from disk');
    }
    async function keepMyVersion() {
      if (!conflict || conflict.id!==currentId) return hideConflict();
      currentCaptionVersion=conflict.captionVersion; hideConflict(); dirty=true; await saveNow();
    }

    // Live updates: poll cheap caption-file signatures and pull in captions changed outside the reviewer
    // (e.g. by a captioning script), without marking anything Viewed. Unsaved edits are never overwritten.
    const LIVE_POLL_MS=2500;
    let liveSignatures=null, liveItemsGeneration=-1, livePollBusy=false;
    function setItemDot(id,hasCaption) {
      document.querySelector(`.item[data-id="${id}"] .dot`)?.classList.toggle('missing',!hasCaption);
      const tile=document.querySelector(`.tile[data-id="${id}"]`);
      if (tile) { tile.classList.toggle('missing-caption',!hasCaption); tile.title=items[id].path+(hasCaption?'':'\n(no caption file yet)'); }
    }
    function updateTileStatus(id) {
      const tile=document.querySelector(`.tile[data-id="${id}"]`); if (!tile) return;
      const status=items[id].reviewStatus; let badge=tile.querySelector('.tile-status');
      if (!status) { badge?.remove(); return; }
      if (!badge) { badge=document.createElement('span'); tile.querySelector('.tile-meta')?.append(badge); }
      badge.className=`tile-status st-${status}`; badge.textContent=status;
    }
    async function applyExternalCaption(id,generation) {
      const data=await fetchJson(`/api/caption-peek?id=${id}`);
      if (generation!==itemsRequestGeneration || !items[id]) return false;
      items[id].captionSearch=data.caption; items[id].hasCaption=data.hasCaption; setItemDot(id,data.hasCaption);
      if (data.reviewStatus && data.reviewStatus!==items[id].reviewStatus) { updateReviewStatus(id,data.reviewStatus); updateTileStatus(id); }
      if (id===currentId && data.captionVersion!==currentCaptionVersion) {
        if (!dirty && !saveInFlight) {
          const tagsFocused=document.activeElement===$('tagTextEditor'), descFocused=document.activeElement===$('descriptionEditor');
          const descCaret=$('descriptionEditor').selectionStart;
          setEditorCaption(data.caption); currentCaptionVersion=data.captionVersion; revision++;
          updateStats(); renderTags(); renderDirectionTools(); setSaveState('Updated from disk');
          if (descFocused) { $('descriptionEditor').focus(); const at=Math.min(descCaret,$('descriptionEditor').value.length); $('descriptionEditor').setSelectionRange(at,at); }
          else if (tagsFocused) $('tagTextEditor').focus();
        } else {
          await showConflict(id);
        }
      }
      return true;
    }
    async function pollLiveChanges() {
      if (livePollBusy || document.hidden || refreshInFlight) return;
      livePollBusy=true;
      try {
        const generation=itemsRequestGeneration;
        const data=await fetchJson('/api/changes',{},10000);
        if (generation!==itemsRequestGeneration) return;
        if (data.listChanged) {
          if (!dirty && !saveInFlight && !refreshInFlight) {
            refreshInFlight=true; $('refresh').disabled=true;
            try { await loadItems(true); } finally { refreshInFlight=false; $('refresh').disabled=false; }
            liveSignatures=null;
          }
          return;
        }
        if (data.count!==items.length) return;
        // Colours: always mirror the server's statuses, so none are missed between polls.
        (data.statuses||[]).forEach((status,id)=>{ if (status && status!==items[id].reviewStatus) { updateReviewStatus(id,status); updateTileStatus(id); } });
        if (liveSignatures===null || liveItemsGeneration!==generation) {
          liveSignatures=data.signatures; liveItemsGeneration=generation; return;
        }
        const changed=[];
        data.signatures.forEach((signature,id)=>{ if (signature!==liveSignatures[id]) changed.push(id); });
        if (!changed.length) return;
        const before=filtered.map(item=>item.id).join(',');
        for (const id of changed) {
          if (!await applyExternalCaption(id,generation)) return;
          liveSignatures[id]=data.signatures[id]; // advanced only once applied, so a failed fetch is retried
        }
        if (currentId!==null && filtered.some(item=>item.id===currentId)) stickyId=currentId;
        if (computeFiltered().map(item=>item.id).join(',')!==before) filterItems();
        else if (viewMode!=='grid') showTextSearchHighlights();
      } catch { /* server busy or restarting: try again on the next tick */ }
      finally { livePollBusy=false; }
    }
    (function liveLoop() { setTimeout(async()=>{ await pollLiveChanges(); liveLoop(); },LIVE_POLL_MS); })();
    // Open straight into grid mode when that was last used, without marking an image Viewed.
    (storage.get('mode','review')==='grid'?setViewMode('grid'):Promise.resolve()).then(()=>loadItems()).catch(apiError);
  </script>
</body>
