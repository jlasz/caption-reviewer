<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caption Reviewer</title>
  <style>
    :root { color-scheme: dark; --bg:#111419; --panel:#1b1f27; --panel2:#151920; --line:#2a303b; --text:#eef1f6; --muted:#909aaa; --accent:#6388ff; --danger:#ff6b7a; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif; }
    button, input, textarea { font:inherit; }
    button { color:var(--text); background:#2b313c; border:1px solid transparent; border-radius:7px; padding:8px 13px; cursor:pointer; }
    button:hover { background:#39414e; } button:disabled { opacity:.35; cursor:default; }
    .accent { background:var(--accent); color:white; font-weight:600; } .accent:hover { background:#7898ff; }
    header { height:57px; display:flex; align-items:center; gap:12px; padding:0 14px; border-bottom:1px solid var(--line); }
    .brand { font-size:16px; font-weight:650; white-space:nowrap; }
    #root { color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    #saveState { color:var(--muted); min-width:110px; text-align:right; } #saveState.dirty { color:#ffd166; } #saveState.error { color:var(--danger); }
    main { height:calc(100% - 114px); min-height:0; display:grid; grid-template-columns:285px minmax(350px,1.5fr) minmax(360px,1fr); grid-template-rows:minmax(0,1fr); gap:1px; background:var(--line); }
    aside, .viewer, .editor-panel { height:100%; min-width:0; min-height:0; overflow:hidden; background:var(--panel); }
    aside { display:flex; flex-direction:column; padding:11px; }
    .eyebrow { color:var(--muted); font-size:11px; letter-spacing:.09em; font-weight:700; margin-bottom:8px; }
    .search-label { color:var(--muted); font-size:10px; letter-spacing:.07em; font-weight:700; margin:1px 2px 4px; }
    .search-label-row { display:flex; align-items:center; justify-content:space-between; gap:6px; margin:1px 2px 4px; }
    .search-label-row .search-label { min-width:0; margin:0; }
    .search-mode { flex:none; min-width:60px; padding:1px 5px; border:1px solid currentColor; border-radius:4px; background:transparent; font-size:10px; line-height:1.35; font-weight:700; }
    .search-mode:hover { background:#2a313c; }
    .search-mode[data-mode="everything"] { color:#55d77b; }
    .search-mode[data-mode="caption"] { color:#f0ca61; }
    .search-mode[data-mode="tags"] { color:#62a9ff; }
    .filter-input { width:100%; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:7px; outline:none; padding:9px 10px; margin-bottom:8px; }
    .filter-input:focus { border-color:var(--accent); }
    #list { flex:1; min-height:0; overflow:auto; scrollbar-color:#424b59 transparent; }
    .item { width:100%; display:flex; align-items:center; gap:8px; border:0; border-radius:5px; background:transparent; padding:6px 8px; text-align:left; color:#cdd3dd; white-space:nowrap; }
    .item:hover { background:#252b35; } .item.active { background:var(--accent); color:white; }
    .item.viewed { color:#f3d77a; font-weight:600; } .item.edited { color:#e96f1a; font-weight:600; } .item.done { color:#35e47a; font-weight:600; }
    .item.viewed.active { color:#f3d77a; } .item.edited.active { color:#e96f1a; } .item.done.active { color:#35e47a; }
    .dot { width:7px; height:7px; border-radius:50%; background:#596273; flex:none; } .dot.missing { background:#e7a94b; }
    .item-label { overflow:hidden; text-overflow:ellipsis; }
    #listCount { color:var(--muted); font-size:12px; margin-top:8px; }
    .viewer { display:flex; flex-direction:column; padding:10px; }
    #imageStage { position:relative; flex:1 1 0; min-width:0; min-height:0; overflow:auto; background:#0a0c0f linear-gradient(135deg,#090b0e 0%,#242a33 50%,#0c1015 100%); border-radius:7px; }
    #imageHost { position:absolute; inset:0; }
    #image { display:block; width:100%; height:100%; object-fit:contain; object-position:right center; }
    #imageStage.actual #imageHost { position:static; width:max-content; height:max-content; }
    #imageStage.actual #image { width:auto; height:auto; max-width:none; max-height:none; }
    #directionTools { flex:none; display:flex; align-items:center; gap:5px; padding:3px 5px; border:1px solid #343d4b; border-radius:7px; background:#202630; }
    #directionTools[hidden] { display:none; }
    .direction-kicker { padding-right:6px; border-right:1px solid #3a4351; color:var(--muted); font-size:9px; line-height:1.2; letter-spacing:.08em; font-weight:700; white-space:nowrap; }
    #directionScope { margin:0 2px 0 0; color:#dbe4f4; font-size:10px; letter-spacing:.05em; font-weight:750; white-space:nowrap; }
    .direction-action { width:auto; margin:0; padding:4px 7px; font-size:11px; line-height:1.3; font-weight:650; white-space:nowrap; }
    .viewer-bar { flex:0 0 43px; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    #imageName { flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tiny { padding:5px 9px; font-size:12px; }
    .editor-panel { padding:11px; display:grid; grid-template-rows:auto minmax(90px,1.1fr) auto minmax(130px,1.7fr) auto minmax(110px,1.5fr); }
    .caption-head { display:flex; } #stats { margin-left:auto; color:var(--muted); font-size:12px; }
    .text-editor-wrap { position:relative; width:100%; height:100%; min-height:0; background:var(--panel2); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .split-editor { position:relative; z-index:2; width:100%; height:100%; min-height:0; resize:none; color:var(--text); caret-color:var(--text); background:var(--panel2); border:0; border-radius:7px; outline:none; padding:12px 14px; font:18px/1.55 "Segoe UI",system-ui,sans-serif; }
    .split-editor:disabled { opacity:.45; }
    .text-editor-wrap:focus-within { border-color:#3c4656; }
    .editor-highlights { position:absolute; z-index:1; inset:0; overflow:hidden; padding:12px 14px; color:var(--text); background:var(--panel2); white-space:pre-wrap; overflow-wrap:break-word; font:18px/1.55 "Segoe UI",system-ui,sans-serif; pointer-events:none; visibility:hidden; }
    .text-editor-wrap.highlighting .editor-highlights { visibility:visible; }
    .text-editor-wrap.highlighting .split-editor { color:transparent; -webkit-text-fill-color:transparent; background:transparent; }
    .caption-match { color:#56a8ff; background:rgba(49,132,255,.2); border-radius:3px; animation:bluePulse .72s ease-in-out infinite alternate; }
    .caption-match.deleting { text-decoration-line:line-through; text-decoration-color:#ff4058; text-decoration-thickness:3px; }
    .tag-head { display:flex; align-items:end; margin-top:11px; padding:10px 2px 7px; border-top:1px solid var(--line); }
    #tagCount { margin-left:auto; color:var(--muted); font-size:12px; }
    #tagPanel { min-height:0; overflow:auto; align-content:start; display:flex; flex-wrap:wrap; gap:7px; padding:11px; background:var(--panel2); border:1px solid var(--line); border-radius:7px; scrollbar-color:#424b59 transparent; }
    .tag-chip { display:inline-flex; align-items:center; align-self:flex-start; max-width:100%; min-height:30px; padding:3px 4px 3px 10px; border:1px solid #3a4351; border-radius:999px; background:#282f39; color:#e3e7ee; }
    .tag-chip:hover, .tag-chip.search-highlight { animation:chipBluePulse .72s ease-in-out infinite alternate; }
    .tag-text { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tag-remove { flex:none; width:24px; height:24px; margin-left:5px; padding:0; display:grid; place-items:center; border:0; border-radius:50%; background:transparent; color:#9da6b4; font-size:17px; line-height:1; }
    .tag-remove:hover { color:white; background:#d94b5c; }
    .tag-empty { color:var(--muted); font-size:13px; padding:3px; }
    #undoToast { position:fixed; z-index:20; right:18px; bottom:68px; display:flex; align-items:center; gap:14px; max-width:440px; padding:10px 12px 10px 15px; color:var(--text); background:#303744; border:1px solid #4a5566; border-radius:9px; box-shadow:0 8px 28px rgba(0,0,0,.38); opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .15s,transform .15s; }
    #undoToast.visible { opacity:1; transform:none; pointer-events:auto; }
    #undoMessage { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #undoButton { flex:none; padding:5px 9px; color:#9fc0ff; background:transparent; font-weight:650; }
    @keyframes bluePulse { from { color:#69b4ff; background-color:rgba(49,132,255,.16); } to { color:#b9dcff; background-color:rgba(49,132,255,.38); } }
    @keyframes chipBluePulse { from { color:#69b4ff; border-color:#348cff; box-shadow:0 0 0 0 rgba(52,140,255,.1); } to { color:#c5e3ff; border-color:#8bc2ff; box-shadow:0 0 0 2px rgba(52,140,255,.28); } }
    footer { height:57px; display:flex; align-items:center; padding:0 14px; border-top:1px solid var(--line); }
    #position { flex:1; text-align:center; color:var(--muted); }
    .empty { color:var(--muted); padding:25px; text-align:center; }
    @media (max-width:1050px) { main { grid-template-columns:230px minmax(300px,1fr) minmax(320px,1fr); } }
  </style>
</head>
<body>
  <header>
    <div class="brand">Caption Reviewer</div>
    <div id="root"></div>
    <button id="refresh" class="tiny" title="Rescan for newly generated captions and images">Refresh</button>
    <span id="saveState">Loading…</span>
    <button id="save">Save&nbsp; Ctrl+S</button>
  </header>
  <main>
    <aside>
      <div class="eyebrow">IMAGES</div>
      <div class="search-label">IMAGE NAME</div>
      <input id="search" class="filter-input" type="search" placeholder="Folder or filename…" autocomplete="off">
      <div class="search-label-row">
        <div class="search-label">TEXT FILE CONTENT</div>
        <button id="textSearchMode" class="search-mode" type="button" data-mode="everything">Everything</button>
      </div>
      <input id="textSearch" class="filter-input" type="search" placeholder="Exact text occurrence…" autocomplete="off">
      <div class="search-label-row">
        <div class="search-label">EXCLUDE TEXT FILE CONTENT</div>
        <button id="negativeTextSearchMode" class="search-mode" type="button" data-mode="everything">Everything</button>
      </div>
      <input id="negativeTextSearch" class="filter-input" type="search" placeholder="Text that must be absent…" autocomplete="off">
      <div id="list"></div>
      <div id="listCount"></div>
    </aside>
    <section class="viewer">
      <div id="imageStage">
        <div id="imageHost"><div class="empty">Choose an image</div></div>
      </div>
      <div class="viewer-bar">
        <span id="imageName"></span>
        <div id="directionTools" hidden>
          <span class="direction-kicker">CAPTION FIX</span>
          <span id="directionScope"></span>
          <button id="directionSwap" class="direction-action" type="button"></button>
          <button id="directionChange" class="direction-action" type="button"></button>
          <button id="directionRemove" class="direction-action" type="button"></button>
        </div>
        <button id="fit" class="tiny">100%</button>
      </div>
    </section>
    <section class="editor-panel">
      <div class="caption-head"><div class="eyebrow">TAGS (TEXT)</div><span id="stats"></span></div>
      <div id="tagTextWrap" class="text-editor-wrap">
        <div id="tagTextHighlights" class="editor-highlights" aria-hidden="true"></div>
        <textarea id="tagTextEditor" class="split-editor" spellcheck="false" disabled></textarea>
      </div>
      <div class="tag-head"><div class="eyebrow" style="margin:0">CAPTION</div></div>
      <div id="descriptionWrap" class="text-editor-wrap">
        <div id="descriptionHighlights" class="editor-highlights" aria-hidden="true"></div>
        <textarea id="descriptionEditor" class="split-editor" spellcheck="true" disabled></textarea>
      </div>
      <div class="tag-head"><div class="eyebrow" style="margin:0">TAGS</div><span id="tagCount"></span></div>
      <div id="tagPanel"><span class="tag-empty">Choose an image to view its tags.</span></div>
    </section>
  </main>
  <footer>
    <button id="previous">←&nbsp; Previous unfinished</button>
    <div id="position">No images</div>
    <button id="next" class="accent">Next unfinished&nbsp; →</button>
  </footer>
  <div id="undoToast" role="status"><span id="undoMessage"></span><button id="undoButton" type="button">Undo</button></div>
  <script src="/caption_direction_tools.js"></script>
  <script src="/caption_filter_tools.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const {parseDirectionQuery,containsDirection,editDescription,opposite}=CaptionDirectionTools;
    const {flattenCaptionPart,splitTags,splitCaptionText,joinCaptionText,searchableCaptionText}=CaptionFilterTools;
    let items = [], filtered = [], currentId = null, dirty = false, revision = 0;
    let saveTimer = null, saveInFlight = null, viewed = new Set(), actualSize = false;
    let lastTagDeletion = null, undoToastTimer = null;
    let currentCaptionVersion = null, refreshInFlight = false;
    let itemsRequestGeneration = 0, navigationRequestGeneration = 0;
    const searchModes=[
      {key:'everything',label:'Everything',description:'the entire text file'},
      {key:'caption',label:'Caption',description:'the caption only'},
      {key:'tags',label:'Tags',description:'the tags only'},
    ];

    function setSaveState(text, kind='') { $('saveState').textContent=text; $('saveState').className=kind; }
    async function fetchJson(url,options={},timeoutMs=15000) {
      const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),timeoutMs);
      try {
        const response=await fetch(url,{...options,signal:controller.signal});
        let data;
        try { data=await response.json(); }
        catch { data={error:`Invalid response from Caption Reviewer (${response.status})`}; }
        if (!response.ok) throw new Error(data.error || `Caption Reviewer request failed (${response.status})`);
        return data;
      } catch(error) {
        if (error?.name==='AbortError') throw new Error('Caption Reviewer request timed out. Try again; your open text has not been discarded.');
        throw error;
      } finally { clearTimeout(timer); }
    }
    function editorCaption() { return joinCaptionText(tagsFromEditor(),$('descriptionEditor').value); }
    function tagsFromEditor() {
      const value=$('tagTextEditor').value.replace(/\.\s*$/,'');
      return splitTags(value);
    }
    function setEditorCaption(value) {
      const parts=splitCaptionText(value);
      $('tagTextEditor').value=parts.tags.join(', ')+(parts.tags.length && parts.description?'. ':'');
      $('descriptionEditor').value=parts.description;
    }
    function normalizeTagSeparator() {
      const tags=tagsFromEditor(), hasDescription=$('descriptionEditor').value.trim().length>0;
      const normalized=tags.join(', ')+(tags.length && hasDescription?'. ':'');
      const changed=$('tagTextEditor').value!==normalized;
      if (changed) $('tagTextEditor').value=normalized;
      return changed;
    }
    function updateStats() { const text=editorCaption(); $('stats').textContent=`${text.length.toLocaleString()} characters · ${(text.trim() ? text.trim().split(/\s+/).length : 0).toLocaleString()} words`; }
    function apiError(error) {
      const message=error?.message || String(error);
      setSaveState('Error', 'error'); $('saveState').title=message; console.error(message);
    }
    function renderDirectionTools() {
      const query=$('textSearchMode').dataset.mode==='tags'?null:parseDirectionQuery($('textSearch').value), tools=$('directionTools');
      tools.hidden=!query;
      if (!query) return;
      const other=opposite(query.side), source=query.side[0].toLocaleUpperCase(), target=other[0].toLocaleUpperCase();
      const phrase=`${query.scope} ${query.side}`, otherPhrase=`${query.scope} ${other}`;
      $('directionScope').textContent=`${query.scope.toLocaleUpperCase()} · ${query.side.toLocaleUpperCase()}`;
      $('directionSwap').textContent='L ⇄ R';
      $('directionChange').textContent=`${source} → ${target}`;
      $('directionRemove').textContent=`✕ ${source} sentences`;
      $('directionSwap').title=`Swap “${query.scope} left” and “${query.scope} right” in the caption only`;
      $('directionChange').title=`Change every “${phrase}” to “${otherPhrase}” in the caption only`;
      $('directionRemove').title=`Remove caption sentences containing “${phrase}”`;
      const description=currentId===null?'':$('descriptionEditor').value;
      $('directionSwap').disabled=!containsDirection(description,query,true);
      $('directionChange').disabled=!containsDirection(description,query);
      $('directionRemove').disabled=!containsDirection(description,query);
    }
    function applyDirectionEdit(action) {
      if (currentId===null) return;
      if ($('textSearchMode').dataset.mode==='tags') return;
      const query=parseDirectionQuery($('textSearch').value); if (!query) return;
      const editor=$('descriptionEditor'), before=editor.value, after=editDescription(before,query,action);
      if (after===before) return;
      editor.value=after; markDirty(); renderDirectionTools(); editor.focus();
      editor.setSelectionRange(editor.value.length,editor.value.length);
    }

    function updateSearchModeButton(button) {
      const index=searchModes.findIndex(mode=>mode.key===button.dataset.mode);
      const current=searchModes[index>=0?index:0], next=searchModes[(index>=0?index:0)+1] || searchModes[0];
      button.dataset.mode=current.key; button.textContent=current.label;
      const filterName=button.id==='textSearchMode'?'Text file content':'Exclude text file content';
      button.title=`Search ${current.description}. Click to switch to ${next.label}.`;
      button.setAttribute('aria-label',`${filterName} search mode: ${current.label}. Click to switch to ${next.label}.`);
    }
    function cycleSearchMode(button) {
      const index=searchModes.findIndex(mode=>mode.key===button.dataset.mode);
      button.dataset.mode=searchModes[((index>=0?index:0)+1)%searchModes.length].key;
      updateSearchModeButton(button); clearTagHighlights(); filterItems();
      if (button.id==='textSearchMode' && ($('textSearch').matches(':hover') || document.querySelector('.item:hover'))) showTextSearchHighlights();
    }
    function findOriginalTagRange(tagIndex) {
      const value=$('tagTextEditor').value, tags=tagsFromEditor(); let cursor=0;
      for (let index=0;index<=tagIndex && index<tags.length;index++) {
        const pieces=tags[index].split(/\s+/).filter(Boolean).map(piece=>piece.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
        const match=new RegExp(pieces.join('\\s+'),'i').exec(value.slice(cursor));
        if (!match) return null;
        const start=cursor+match.index, end=start+match[0].length;
        if (index===tagIndex) return {start,end};
        cursor=end;
      }
      return null;
    }
    function renderEditorHighlights(editorId,highlightsId,tag,deleteRange=null) {
      const value=$(editorId).value, needle=tag.toLocaleLowerCase(), fragment=document.createDocumentFragment(); let cursor=0;
      while (cursor<value.length) {
        const start=value.toLocaleLowerCase().indexOf(needle,cursor);
        if (start<0) { fragment.append(document.createTextNode(value.slice(cursor))); break; }
        if (start>cursor) fragment.append(document.createTextNode(value.slice(cursor,start)));
        const end=start+tag.length, match=document.createElement('span');
        match.className='caption-match'+(deleteRange && start===deleteRange.start && end===deleteRange.end?' deleting':'');
        match.textContent=value.slice(start,end); fragment.append(match); cursor=end;
      }
      if (!value.length) fragment.append(document.createTextNode(''));
      $(highlightsId).replaceChildren(fragment); syncHighlightScroll(editorId,highlightsId); $(editorId).parentElement.classList.add('highlighting');
    }
    function showTagHighlights(tag,tagIndex,deleting=false) {
      if (!tag) return;
      renderEditorHighlights('tagTextEditor','tagTextHighlights',tag,deleting?findOriginalTagRange(tagIndex):null);
      renderEditorHighlights('descriptionEditor','descriptionHighlights',tag);
    }
    function showTextSearchHighlights() {
      const query=$('textSearch').value.trim(); if (!query) return;
      const mode=$('textSearchMode').dataset.mode;
      clearTagHighlights();
      if (mode!=='caption') renderEditorHighlights('tagTextEditor','tagTextHighlights',query);
      if (mode!=='tags') renderEditorHighlights('descriptionEditor','descriptionHighlights',query);
      const needle=query.toLocaleLowerCase();
      if (mode!=='caption') document.querySelectorAll('.tag-chip').forEach(chip=>chip.classList.toggle('search-highlight',chip.title.toLocaleLowerCase().includes(needle)));
    }
    function clearTagHighlights() {
      for (const id of ['tagTextWrap','descriptionWrap']) $(id).classList.remove('highlighting');
      $('tagTextHighlights').replaceChildren(); $('descriptionHighlights').replaceChildren();
      document.querySelectorAll('.tag-chip.search-highlight').forEach(chip=>chip.classList.remove('search-highlight'));
    }
    function syncHighlightScroll(editorId,highlightsId) { $(highlightsId).scrollTop=$(editorId).scrollTop; $(highlightsId).scrollLeft=$(editorId).scrollLeft; }
    function renderTags() {
      clearTagHighlights();
      const tags=tagsFromEditor(), fragment=document.createDocumentFragment();
      $('tagCount').textContent=`${tags.length.toLocaleString()} ${tags.length===1?'tag':'tags'}`;
      if (!tags.length) { const empty=document.createElement('span'); empty.className='tag-empty'; empty.textContent='No tag prefix detected.'; fragment.append(empty); }
      tags.forEach((tag,index)=>{
        const chip=document.createElement('span'); chip.className='tag-chip'; chip.title=tag;
        const text=document.createElement('span'); text.className='tag-text'; text.textContent=tag;
        const remove=document.createElement('button'); remove.className='tag-remove'; remove.type='button'; remove.textContent='×'; remove.title=`Remove ${tag}`; remove.setAttribute('aria-label',`Remove tag ${tag}`);
        chip.addEventListener('mouseenter',()=>showTagHighlights(tag,index)); chip.addEventListener('mouseleave',clearTagHighlights);
        remove.addEventListener('mouseenter',()=>showTagHighlights(tag,index,true)); remove.addEventListener('mouseleave',()=>showTagHighlights(tag,index));
        remove.addEventListener('click',()=>removeTag(index)); chip.append(text,remove); fragment.append(chip);
      });
      $('tagPanel').replaceChildren(fragment);
    }
    function removeTag(index) {
      const tags=tagsFromEditor(); if (index<0 || index>=tags.length) return;
      const before=editorCaption(), tag=tags[index];
      tags.splice(index,1); $('tagTextEditor').value=tags.join(', ')+(tags.length && $('descriptionEditor').value.trim()?'. ':'');
      const after=editorCaption();
      lastTagDeletion={itemId:currentId,index,tag,before,after}; markDirty(); showUndoToast(tag);
    }
    function showUndoToast(tag) {
      clearTimeout(undoToastTimer); $('undoMessage').textContent=`Removed “${tag}”`; $('undoToast').classList.add('visible');
      undoToastTimer=setTimeout(()=>hideUndoToast(false),6000);
    }
    function hideUndoToast(forget=false) {
      clearTimeout(undoToastTimer); undoToastTimer=null; $('undoToast').classList.remove('visible'); if (forget) lastTagDeletion=null;
    }
    function undoTagDeletion() {
      const deletion=lastTagDeletion; if (!deletion || deletion.itemId!==currentId) return;
      if (editorCaption()===deletion.after) setEditorCaption(deletion.before);
      else {
        const tags=tagsFromEditor();
        tags.splice(Math.min(deletion.index,tags.length),0,deletion.tag);
        $('tagTextEditor').value=tags.join(', ')+($('descriptionEditor').value.trim()?'. ':'');
      }
      lastTagDeletion=null; hideUndoToast(); markDirty(); $('tagTextEditor').focus();
    }

    async function loadItems(rescan=false) {
      const requestGeneration=++itemsRequestGeneration;
      const oldPath = currentId === null ? null : items[currentId]?.path;
      const data=await fetchJson(rescan ? '/api/rescan' : '/api/items',{method:rescan?'POST':'GET'},rescan?60000:30000);
      if (requestGeneration!==itemsRequestGeneration) return;
      items=data.items; currentId=null; $('root').textContent=data.root; filterItems();
      const restored = oldPath ? items.findIndex(item => item.path === oldPath) : -1;
      const firstUnfinished=items.findIndex(item=>item.reviewStatus!=='D');
      if (items.length) await goTo(restored >= 0 ? restored : firstUnfinished >= 0 ? firstUnfinished : 0); else clearView('No supported images found.');
    }

    function filterItems() {
      const nameTerms=$('search').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
      const captionQuery=$('textSearch').value.trim().toLocaleLowerCase();
      const negativeCaptionQuery=$('negativeTextSearch').value.trim().toLocaleLowerCase();
      const captionMode=$('textSearchMode').dataset.mode, negativeCaptionMode=$('negativeTextSearchMode').dataset.mode;
      filtered=items.filter(item => {
        const rawCaption=item.captionSearch || '';
        const parts=captionMode==='everything' && negativeCaptionMode==='everything'?null:splitCaptionText(rawCaption);
        const caption=searchableCaptionText(rawCaption,captionMode,parts).toLocaleLowerCase();
        const negativeCaption=searchableCaptionText(rawCaption,negativeCaptionMode,parts).toLocaleLowerCase();
        return nameTerms.every(term => item.path.toLocaleLowerCase().includes(term)) &&
          (!captionQuery || caption.includes(captionQuery)) &&
          (!negativeCaptionQuery || !negativeCaption.includes(negativeCaptionQuery));
      });
      const fragment=document.createDocumentFragment();
      for (const item of filtered) {
        const statusClass=item.reviewStatus==='D'?' done':item.reviewStatus==='E'?' edited':item.reviewStatus==='V'?' viewed':'';
        const button=document.createElement('button'); button.className='item'+statusClass+(item.id===currentId?' active':''); button.dataset.id=item.id; button.title=item.path+'\nDouble-click when selected to cycle Viewed/Edited/Done';
        const dot=document.createElement('span'); dot.className='dot'+(item.hasCaption?'':' missing');
        const label=document.createElement('span'); label.className='item-label'; label.textContent=item.path.replace(/\.[^.]+$/, '')+(item.reviewStatus?` ${item.reviewStatus}`:'');
        button.append(dot,label);
        button.addEventListener('mousedown',event=>{if(event.detail===1) button.dataset.wasSelected=item.id===currentId?'1':'0'});
        button.addEventListener('click',()=>goTo(item.id));
        button.addEventListener('dblclick',event=>{event.preventDefault();if(button.dataset.wasSelected==='1') toggleReviewStatus(item.id)});
        button.addEventListener('mouseenter',showTextSearchHighlights);
        button.addEventListener('mouseleave',clearTagHighlights);
        fragment.append(button);
      }
      $('list').replaceChildren(fragment);
      updateProgressCounters();
      scrollActive(false); updateNavigation(); renderDirectionTools();
    }

    function updateProgressCounters() {
      const done=filtered.filter(item=>item.reviewStatus==='D').length;
      const edited=filtered.filter(item=>item.reviewStatus==='E').length;
      const viewedCount=filtered.filter(item=>item.reviewStatus==='V').length;
      const remaining=filtered.length-done-edited-viewedCount;
      $('listCount').textContent=`${done.toLocaleString()} Done · ${edited.toLocaleString()} Edited · ${viewedCount.toLocaleString()} Viewed · ${remaining.toLocaleString()} Remaining`;
      $('listCount').title=`${filtered.length.toLocaleString()} shown · ${items.length.toLocaleString()} total`;
    }

    function scrollActive(smooth=true) {
      document.querySelectorAll('.item.active').forEach(el=>el.classList.remove('active'));
      const active=document.querySelector(`.item[data-id="${currentId}"]`);
      if (active) { active.classList.add('active'); active.scrollIntoView({block:'nearest',behavior:smooth?'smooth':'auto'}); }
    }

    function updateReviewStatus(id,status) {
      if (!status || !items[id]) return;
      items[id].reviewStatus=status;
      updateProgressCounters(); updateNavigation();
      const item=document.querySelector(`.item[data-id="${id}"]`); if (!item) return;
      item.classList.remove('viewed','edited','done'); item.classList.add(status==='D'?'done':status==='E'?'edited':'viewed');
      const label=item.querySelector('.item-label'); if (label) label.textContent=items[id].path.replace(/\.[^.]+$/, '')+` ${status}`;
    }

    async function setReviewStatus(id,status) {
      try {
        const data=await fetchJson(`/api/status?id=${id}&status=${status}`,{method:'POST'});
        updateReviewStatus(id,data.reviewStatus); return true;
      } catch(error) { apiError(error); return false; }
    }

    async function toggleReviewStatus(id) {
      if (id!==currentId || !items[id] || !['V','E','D'].includes(items[id].reviewStatus)) return;
      const next={V:'E',E:'D',D:'V'}[items[id].reviewStatus];
      await setReviewStatus(id,next);
    }

    async function goTo(id) {
      if (id===currentId || id<0 || id>=items.length) return;
      const requestGeneration=++navigationRequestGeneration;
      if (!await flushSave()) { scrollActive(false); return; }
      const target=items[id]; setSaveState('Loading…');
      try {
        const data=await fetchJson(`/api/caption?id=${id}`);
        if (requestGeneration!==navigationRequestGeneration) return;
        currentId=id; viewed.add(id); dirty=false; revision++; currentCaptionVersion=data.captionVersion; clearTimeout(saveTimer); hideUndoToast(true);
        $('tagTextEditor').disabled=false; $('descriptionEditor').disabled=false; setEditorCaption(data.caption); updateStats(); renderTags(); renderDirectionTools();
        $('image')?.remove(); const image=document.createElement('img'); image.id='image'; image.alt=target.path; image.src=`/api/image?id=${id}`;
        image.addEventListener('dblclick',toggleFit); $('imageHost').replaceChildren(image);
        actualSize=false; $('imageStage').classList.remove('actual'); $('fit').textContent='100%';
        $('imageName').textContent=target.path; items[id].hasCaption=data.hasCaption; items[id].captionSearch=data.caption; updateReviewStatus(id,data.reviewStatus); setSaveState(data.hasCaption?'Saved':'New caption');
        updateNavigation(); scrollActive(); $('descriptionEditor').focus();
        if ($('textSearch').matches(':hover') || document.querySelector('.item:hover')) showTextSearchHighlights();
      } catch(error) { apiError(error); }
    }

    function markDirty() {
      if (currentId===null) return; dirty=true; revision++; setSaveState('Unsaved changes','dirty'); updateStats(); renderTags();
      renderDirectionTools();
      clearTimeout(saveTimer); saveTimer=setTimeout(saveNow, 800);
    }

    async function saveNow() {
      clearTimeout(saveTimer); saveTimer=null;
      if (saveInFlight) await saveInFlight;
      if (!dirty || currentId===null) return true;
      const id=currentId, text=editorCaption(), savedRevision=revision, expectedVersion=currentCaptionVersion; setSaveState('Saving…');
      saveInFlight=(async()=>{
        try {
          const data=await fetchJson(`/api/caption?id=${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({caption:text,captionVersion:expectedVersion})},20000);
          items[id].hasCaption=true;
          items[id].captionSearch=text;
          currentCaptionVersion=data.captionVersion;
          updateReviewStatus(id,data.reviewStatus);
          if (currentId===id && revision===savedRevision) { dirty=false; setSaveState('Saved'); }
          else if (currentId===id) { dirty=true; setSaveState('Unsaved changes','dirty'); }
          const dot=document.querySelector(`.item[data-id="${id}"] .dot`); dot?.classList.remove('missing');
          if ($('textSearch').value || $('negativeTextSearch').value) filterItems(); return true;
        } catch(error) { apiError(error); return false; } finally { saveInFlight=null; }
      })();
      return await saveInFlight;
    }

    async function flushSave() { while (dirty) { if (!await saveNow()) return false; } return true; }
    function unfinishedTarget(offset) {
      if (!filtered.length) return null;
      const position=filtered.findIndex(item=>item.id===currentId);
      if (position<0) {
        const candidates=offset>0?filtered:[...filtered].reverse();
        return candidates.find(item=>item.reviewStatus!=='D')?.id ?? null;
      }
      for (let index=position+offset;index>=0 && index<filtered.length;index+=offset) {
        if (filtered[index].reviewStatus!=='D') return filtered[index].id;
      }
      return null;
    }
    function updateNavigation() {
      const position=filtered.findIndex(item=>item.id===currentId), filteredMode=$('search').value.trim()!=='' || $('textSearch').value.trim()!=='' || $('negativeTextSearch').value.trim()!=='';
      if (currentId===null) { $('position').textContent='No images'; $('previous').disabled=true; $('next').disabled=true; return; }
      const place=position>=0 ? `${(position+1).toLocaleString()} / ${filtered.length.toLocaleString()}${filteredMode?' filtered':''}` : `Outside current filter · ${filtered.length.toLocaleString()} shown`;
      $('position').textContent=`${place} · ${viewed.size.toLocaleString()} viewed this session`;
      $('previous').disabled=unfinishedTarget(-1)===null;
      $('next').disabled=unfinishedTarget(1)===null;
    }
    async function navigate(offset) {
      const target=unfinishedTarget(offset); if (target!==null) await goTo(target);
    }
    async function markDoneAndAdvance() {
      if (currentId===null || !await flushSave()) return;
      const id=currentId;
      if (items[id].reviewStatus!=='D' && !await setReviewStatus(id,'D')) return;
      await navigate(1);
    }
    function focusTagEnd() {
      const editor=$('tagTextEditor'); editor.focus(); editor.setSelectionRange(editor.value.length,editor.value.length);
    }
    function focusDescriptionStart() {
      const editor=$('descriptionEditor'); editor.focus(); editor.setSelectionRange(0,0);
    }
    function handleEditorBoundary(event) {
      const editor=event.currentTarget, collapsed=editor.selectionStart===editor.selectionEnd;
      if (!collapsed || event.shiftKey || event.ctrlKey || event.altKey || event.metaKey) return;
      if (editor.id==='descriptionEditor' && editor.selectionStart===0 && ['ArrowLeft','ArrowUp','Backspace'].includes(event.key)) {
        event.preventDefault(); focusTagEnd();
      } else if (editor.id==='tagTextEditor' && editor.selectionStart===editor.value.length && ['ArrowRight','ArrowDown','Delete'].includes(event.key)) {
        event.preventDefault(); focusDescriptionStart();
      }
    }
    function toggleFit() { actualSize=!actualSize; $('imageStage').classList.toggle('actual',actualSize); $('fit').textContent=actualSize?'Fit':'100%'; }
    function clearView(message) { currentId=null; setEditorCaption(''); $('tagTextEditor').disabled=true; $('descriptionEditor').disabled=true; renderTags(); $('imageHost').innerHTML=`<div class="empty">${message}</div>`; renderDirectionTools(); $('position').textContent='No images'; }

    $('tagTextEditor').addEventListener('input',markDirty);
    $('descriptionEditor').addEventListener('input',()=>{normalizeTagSeparator();markDirty()});
    $('tagTextEditor').addEventListener('blur',()=>{if(normalizeTagSeparator()) markDirty()});
    for (const editor of [$('tagTextEditor'),$('descriptionEditor')]) editor.addEventListener('keydown',handleEditorBoundary);
    $('tagTextEditor').addEventListener('scroll',()=>syncHighlightScroll('tagTextEditor','tagTextHighlights'));
    $('descriptionEditor').addEventListener('scroll',()=>syncHighlightScroll('descriptionEditor','descriptionHighlights'));
    $('save').addEventListener('click',saveNow); $('previous').addEventListener('click',()=>navigate(-1)); $('next').addEventListener('click',()=>navigate(1)); $('undoButton').addEventListener('click',undoTagDeletion);
    $('directionSwap').addEventListener('click',()=>applyDirectionEdit('swap'));
    $('directionChange').addEventListener('click',()=>applyDirectionEdit('change'));
    $('directionRemove').addEventListener('click',()=>applyDirectionEdit('remove'));
    $('fit').addEventListener('click',toggleFit); $('search').addEventListener('input',filterItems);
    $('textSearch').addEventListener('input',()=>{filterItems();if($('textSearch').matches(':hover')) showTextSearchHighlights()});
    $('negativeTextSearch').addEventListener('input',filterItems);
    for (const button of [$('textSearchMode'),$('negativeTextSearchMode')]) {
      updateSearchModeButton(button); button.addEventListener('click',()=>cycleSearchMode(button));
    }
    $('textSearch').addEventListener('mouseenter',showTextSearchHighlights);
    $('textSearch').addEventListener('mouseleave',clearTagHighlights);
    $('refresh').addEventListener('click',async()=>{
      if (refreshInFlight || !await flushSave()) return;
      refreshInFlight=true; $('refresh').disabled=true;
      try { await loadItems(true); } catch(error) { apiError(error); }
      finally { refreshInFlight=false; $('refresh').disabled=false; }
    });
    document.addEventListener('keydown',event=>{
      if (event.ctrlKey && event.key.toLowerCase()==='s') { event.preventDefault(); saveNow(); }
      if (event.ctrlKey && event.key.toLowerCase()==='f') { event.preventDefault(); const search=event.shiftKey?$('textSearch'):$('search'); search.focus(); search.select(); }
      if (event.ctrlKey && !event.shiftKey && event.key.toLowerCase()==='z' && lastTagDeletion?.itemId===currentId && editorCaption()===lastTagDeletion.after) { event.preventDefault(); undoTagDeletion(); }
      if (event.altKey && event.key.toLowerCase()==='d') { event.preventDefault(); markDoneAndAdvance(); }
      if (event.altKey && event.key==='ArrowLeft') { event.preventDefault(); navigate(-1); }
      if (event.altKey && event.key==='ArrowRight') { event.preventDefault(); navigate(1); }
      if (event.ctrlKey && event.key==='PageUp') { event.preventDefault(); navigate(-1); }
      if (event.ctrlKey && event.key==='PageDown') { event.preventDefault(); navigate(1); }
    });
    document.addEventListener('visibilitychange',()=>{if(document.hidden) saveNow()});
    window.addEventListener('pagehide',()=>{if(dirty&&currentId!==null) navigator.sendBeacon(`/api/caption?id=${currentId}`,new Blob([JSON.stringify({caption:editorCaption(),captionVersion:currentCaptionVersion})],{type:'application/json'}))});
    loadItems().catch(apiError);
  </script>
</body>
</html>
